name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check Bash syntax
        run: bash -n ddnscg.sh install.sh tests/test.sh tests/fixtures/mock-curl.sh
      - name: Run ShellCheck
        run: shellcheck ddnscg.sh install.sh tests/test.sh tests/fixtures/mock-curl.sh
      - name: Run tests
        run: bash tests/test.sh
